<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin prijava | RentaPS5PO</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090b14;
      color: white;
      font-family: Arial, sans-serif;
    }
    form {
      width: min(90%, 360px);
      padding: 28px;
      background: #141929;
      border: 1px solid #2b324d;
      border-radius: 14px;
    }
    h1 { color: #9ba7ff; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background: #090b14;
      border: 1px solid #343b58;
      border-radius: 7px;
      color: white;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 7px;
      background: #6878ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>Admin prijava</h1>
    <label for="username">Korisničko ime</label>
    <input id="username" name="username" required>

    <label for="password">Lozinka</label>
    <input id="password" name="password" type="password" required>

    <button type="submit">Prijavi se</button>
  </form>
</body>
</html>
